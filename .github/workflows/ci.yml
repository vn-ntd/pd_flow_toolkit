name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & Code Style (Ruff & Flake8)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff flake8

    - name: Run Ruff Lint Check
      run: |
        ruff check .

    - name: Run Flake8 Check
      run: |
        flake8 pd_toolkit tests --max-line-length=120 --extend-ignore=E501,W503

  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run Unit Tests with Coverage Check (>= 85%)
      run: |
        pytest --cov=pd_toolkit --cov-report=term-missing --cov-fail-under=85

    - name: Run Turnkey Demo Workflow Smoke Test
      run: |
        python pd_tool.py demo
